{% extends "base.html" %}
{% block meta %}
<title>Skills - {{ name }}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon/devicon.min.css">
{% endblock meta %}
{% block content %}
<main>
    <section class="skills">
        <div class="container">
            <div class="section-header">
                <p class="hero-kicker">What I am capable of</p>
                <div class="project-header">
                    <h1>Skills</h1>
                    {% if perms.main.add_skill %}
                    <a href="{% url 'main:create_skill' %}" class="button project-add-button">
                        <span aria-hidden="true">+</span> Add Skill
                    </a>
                    {% endif %}
                </div>
                <select id="skill-filter" aria-label="Filter skill berdasarkan kategori">
                    <option value="all">All</option>
                </select>
            </div>

            <div id="loading" class="empty-state hide"><p>Memuat skills...</p></div>
            <div id="error" class="empty-state hide"><p>Gagal memuat data skills. Silakan coba lagi.</p></div>
            <div id="empty" class="empty-state hide"><p>Belum ada skill.</p></div>
            <div id="skill-container" class="hide"></div>
        </div>
    </section>
</main>

<script>
    const SKILLS_ENDPOINT = "{% url 'main:get_skills_json' %}";
    const IS_AUTH = {{ user.is_authenticated|yesno:"true,false" }};
    const CAN_EDIT = {{ perms.main.change_skill|yesno:"true,false" }};
    const CAN_DELETE = {{ perms.main.delete_skill|yesno:"true,false" }};
    const DUMMY = "00000000-0000-0000-0000-000000000000";
    const urlFor = (tpl, id) => tpl.replace(DUMMY, id);
    const STAR_URL = "{% url 'main:toggle_skill_star' '00000000-0000-0000-0000-000000000000' %}";
    const EDIT_URL = "{% url 'main:edit_skill' '00000000-0000-0000-0000-000000000000' %}";
    const DELETE_URL = "{% url 'main:delete_skill' '00000000-0000-0000-0000-000000000000' %}";

    // Data dari DB dimasukkan lewat innerHTML, jadi wajib di-escape (anti XSS)
    const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);

    const sections = {
        loading: document.getElementById('loading'),
        error: document.getElementById('error'),
        empty: document.getElementById('empty'),
        grid: document.getElementById('skill-container'),
    };
    function show(name) {
        for (const [key, el] of Object.entries(sections)) el.classList.toggle('hide', key !== name);
    }

    function iconHtml(skill) {
        if (skill.icon_kind === 'devicon') return `<i class="${esc(skill.icon)} colored"></i>`;
        if (skill.icon_kind === 'image') return `<img class="tool-icon" src="${esc(skill.icon)}" alt="logo ${esc(skill.name)}">`;
        if (skill.icon_kind === 'emoji') return `<span class="flag">${esc(skill.icon)}</span>`;
        return '';
    }

    function skillHtml(skill) {
        const name = esc(skill.name);
        const star = IS_AUTH ? `
            <form method="post" action="${urlFor(STAR_URL, skill.id)}" class="skill-action-form">
                {% csrf_token %}
                <button type="submit" class="skill-action skill-action--star${skill.is_starred ? ' is-starred' : ''}"
                        title="${skill.is_starred ? 'Batalkan star' : 'Beri star'} ${name}"
                        aria-pressed="${skill.is_starred}">
                    <span aria-hidden="true">${skill.is_starred ? '★' : '☆'}</span>
                    <span class="star-count">${skill.star_count}</span>
                </button>
            </form>` : '';
        const edit = CAN_EDIT ? `
            <a href="${urlFor(EDIT_URL, skill.id)}" class="skill-action" title="Edit ${name}" aria-label="Edit ${name}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 20h9" /><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
                </svg>
            </a>` : '';
        const del = CAN_DELETE ? `
            <form method="post" action="${urlFor(DELETE_URL, skill.id)}" class="skill-action-form"
                  data-name="${name}" onsubmit="return confirm('Hapus ' + this.dataset.name + '?');">
                {% csrf_token %}
                <button type="submit" class="skill-action skill-action--danger" title="Hapus ${name}" aria-label="Hapus ${name}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 6h18" /><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2" />
                        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" /><path d="M10 11v6M14 11v6" />
                    </svg>
                </button>
            </form>` : '';
        return `
            <div class="skill-item">
                <span class="skill-pill${skill.is_featured ? ' skill-pill--featured' : ''}">${iconHtml(skill)} ${name}</span>
                ${star}${edit}${del}
            </div>`;
    }

    async function fetchSkills() {
        show('loading');
        try {
            const response = await fetch(SKILLS_ENDPOINT, { headers: { 'Accept': 'application/json' } });
            if (!response.ok) throw new Error('Failed to fetch skills');
            const categories = await response.json();

            if (categories.length === 0) return show('empty');

            const filter = document.getElementById('skill-filter');
            filter.innerHTML = '<option value="all">All</option>' + categories
                .map(c => `<option value="${esc(c.slug)}">${esc(c.name)}</option>`).join('');

            sections.grid.innerHTML = categories.map(c => `
                <div class="skill-category" data-category="${esc(c.slug)}">
                    <h3 class="skill-category-title">${esc(c.name)}</h3>
                    <div class="skill-list">
                        ${c.skills.length ? c.skills.map(skillHtml).join('')
                                          : '<p class="empty-state">Belum ada skill di kategori ini.</p>'}
                    </div>
                </div>`).join('');
            show('grid');
        } catch (error) {
            console.error('Error loading skills:', error);
            show('error');
        }
    }

    fetchSkills();
</script>
<script src="/static/js/script.js"></script>
{% endblock content %}
