<span class="skill-pill{% if skill.is_featured %} skill-pill--featured{% endif %}">
    {% if skill.icon_kind == "devicon" %}
        <i class="{{ skill.icon }} colored"></i>
    {% elif skill.icon_kind == "image" %}
        <img class="tool-icon" src="{{ skill.icon }}" alt="logo {{ skill.name }}">
    {% elif skill.icon_kind == "emoji" %}
        <span class="flag">{{ skill.icon }}</span>
    {% endif %}
    {{ skill.name }}
    {% if show_level %}
        <span class="skill-pill__level" title="Penguasaan {{ skill.proficiency }} dari 5">{{ skill.proficiency_dots }}</span>
    {% endif %}
</span>
