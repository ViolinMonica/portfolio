{% extends "base.html" %}
{% block meta %}
<title>403 Forbidden - {{ name }}</title>
{% endblock meta %}
{% block content %}
<main>
  <section class="experience-section error-page">
    <div class="container">
      <p class="section-kicker">403</p>
      <h1>Access Denied</h1>
      <p class="empty-state">
        Your account does not have permission to do this action. 
      </p>
      <a href="{% url 'main:show_skills' %}" class="button">Return to Skills</a>
    </div>
  </section>
</main>
{% endblock content %}
